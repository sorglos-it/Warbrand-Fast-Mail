name: Package and upload to CurseForge

# Fires on the release tags this project already uses (v12.1.0.2 and so on).
# The tag name decides the release type: BigWigs' packager treats a tag
# containing "alpha" or "beta" as such and everything else as a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    # CF_API_TOKEN lives in this environment rather than in the repository
    # secrets. A job only sees environment secrets if it asks for the
    # environment by name -- without this line the token resolves to an
    # empty string and the upload is skipped without any error.
    environment: curseforge
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The packager walks tags and history to build the changelog, so a
          # shallow clone would silently produce an empty one.
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          # Add this under Settings -> Secrets and variables -> Actions.
          # Without it the job still builds the zip and simply skips the
          # upload, so the workflow is safe to merge before the token exists.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        with:
          # pandoc is only needed for WoWInterface uploads
          pandoc: false
          # -p passes the CurseForge project id explicitly. The TOC carries
          # it too, but the upload is guarded by a numeric test on the id
          # and the run of v12.1.0.3 packaged happily while never attempting
          # an upload, so this removes the doubt about which source counts.
          args: -p 1655846
