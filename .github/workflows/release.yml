name: Package and upload to CurseForge

# Fires on the release tags this project already uses (v12.1.0.4 and so on).
# The tag name decides the release type: BigWigs' packager treats a tag
# containing "alpha" or "beta" as such and everything else as a release.
on:
  push:
    tags:
      - 'v*'

permissions:
  # write, because the packager creates the GitHub release for the tag
  # and attaches the zip to it
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    # CF_API_TOKEN lives in this environment rather than in the repository
    # secrets. A job only sees environment secrets if it asks for the
    # environment by name -- without this line the token resolves to an
    # empty string and the upload is skipped without any error.
    environment: curseforge
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The packager walks tags and history to build the changelog, so a
          # shallow clone would silently produce an empty one.
          fetch-depth: 0

      # Twice a tag was pushed while the TOC still named the previous
      # version, producing a zip called v12.1.0.4 whose addon reports
      # 12.1.0.3 in game. Nothing downstream notices, so it is caught here.
      - name: Tag and TOC version must agree
        run: |
          toc=$(sed -n 's/^## Version: *//p' Warbrand-Fast-Mail.toc)
          tag=${GITHUB_REF_NAME#v}
          if [ "$toc" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME means $tag but the TOC says $toc"
            exit 1
          fi
          echo "Tag and TOC agree on $toc"

      - name: Package and upload
        uses: BigWigsMods/packager@v2
        env:
          # Both names on purpose, from the one secret. This action is
          # pinned to @v2, whose release.sh reads CF_API_KEY:
          #     [ -z "$cf_token" ] && cf_token=$CF_API_KEY
          # The README on master documents CF_API_TOKEN, which is the newer
          # name and does not apply here. Setting only that one left the
          # token empty, and an empty token is the packager's ordinary
          # "nowhere to upload to" case -- it packaged and exited 0 without
          # a word. Feeding both survives a later bump to master too.
          CF_API_KEY: ${{ secrets.CF_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Same version split: @v2 reads GITHUB_OAUTH, master reads
          # GITHUB_API_TOKEN. GITHUB_TOKEN is issued by Actions itself, so
          # there is nothing to create for this one.
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # pandoc is only needed for WoWInterface uploads
          pandoc: false
          # The TOC carries the id as well; passing it explicitly is the
          # documented path and costs nothing.
          args: -p 1655846
